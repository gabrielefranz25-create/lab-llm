services:
  assistente:
    build: .
    env_file: .env
    environment:
      LM_BASE_URL: http://host.docker.internal:1234/v1   # dal container, l'host non è "localhost"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    volumes:
      - note:/app/dati

volumes:
  note: {}
