services:
  assistente:
    build: .
    env_file: .env
    environment:
      LM_BASE_URL: http://host.docker.internal:1234/v1   # dal container, l'host non è "localhost"
      OROLOGIO_API_URL: http://orologio-api:8001         # usato solo con VARIANTE_OROLOGIO=fastapi
      MCP_HTTP_HOST: server-mcp                          # usato solo con TRASPORTO_MCP=http
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    volumes:
      - note:/app/dati

  # Variante 02 dell'orologio: servizio FastAPI separato, avviato solo con il profilo "fastapi":
  #   docker compose --profile fastapi up -d orologio-api
  orologio-api:
    build: .
    profiles: ["fastapi"]
    command: ["python", "-m", "servizio_orologio.api"]
    environment:
      OROLOGIO_API_HOST: 0.0.0.0   # raggiungibile dagli altri container della rete di compose
      OROLOGIO_API_PORTA: "8001"

  # Blocco C: i server MCP come servizi Streamable HTTP, avviati solo con il profilo "http":
  #   docker compose --profile http up -d server-mcp
  #   docker compose run --rm -e TRASPORTO_MCP=http assistente
  server-mcp:
    build: .
    profiles: ["http"]
    command: ["python", "-m", "server_mcp.avvia_http"]
    env_file: .env
    environment:
      MCP_HTTP_ASCOLTO: 0.0.0.0   # raggiungibili dagli altri container; porte non pubblicate sull'host
    volumes:
      - note:/app/dati            # le note sono le stesse della modalità stdio

volumes:
  note: {}
